[project]
name       = "SAPER"
language   = "macro11"
pre_build  = "source/gen_saper.py"        # emits SAPER.MAC from a template
post_build = "source/make_artifacts.py"   # combines SAPER.HLP, copies SAPER.DAT
outputs    = ["SAPER.SAV", "SAPER.MAP"]   # the map names the state for the tests

[build]
# LINK's line is image,map=objects.
commands   = ["MACRO SAPER=SAPER", "LINK SAPER,SAPER=SAPER"]
