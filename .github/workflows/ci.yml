name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
            conan_compiler: gcc
            conan_compiler_version: "13"
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            compiler: clang-20
            conan_compiler: clang
            conan_compiler_version: "20"
            cc: clang-20
            cxx: clang++-20
          - os: macos-latest
            compiler: apple-clang
          - os: windows-latest
            compiler: msvc

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The emulator and the software collection beside this repository, at
      # the refs deps.toml names - the way a newcomer gets them.
      - name: Fetch the repositories this one stands on
        run: python tools/deps.py

      - name: Install Conan
        run: pip install "conan>=2.0" ninja pytest

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('deps.toml', 'conanfile.py') }}
          restore-keys: |
            conan-${{ matrix.os }}-${{ matrix.compiler }}-

      - name: Install GCC 13
        if: matrix.cc == 'gcc-13'
        run: sudo apt-get install -y gcc-13 g++-13

      - name: Install Clang 20
        if: matrix.cc == 'clang-20'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20

      - name: Configure Conan profile
        shell: bash
        run: |
          conan profile detect --force
          PROFILE=~/.conan2/profiles/default

          sed -i.bak -e 's/^compiler.cppstd=.*/compiler.cppstd=20/' "$PROFILE"

          # Pin compiler + version for Linux jobs (auto-detect uses system default)
          if [ -n "${{ matrix.conan_compiler }}" ]; then
            sed -i -e 's/^compiler=.*/compiler=${{ matrix.conan_compiler }}/' "$PROFILE"
            sed -i -e 's/^compiler\.version=.*/compiler.version=${{ matrix.conan_compiler_version }}/' "$PROFILE"
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            sed -i -e 's/^compiler\.runtime=.*/compiler.runtime=static/' "$PROFILE"
          fi

          {
            echo ""
            echo "[conf]"
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "tools.cmake.cmaketoolchain:generator=Ninja"
            fi
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "tools.system.package_manager:mode=install"
              echo "tools.system.package_manager:sudo=True"
            fi
          } >> "$PROFILE"

          echo "=== Conan profile ==="
          cat "$PROFILE"

      # The harnesses, with the emulator built inside the same build.
      - name: Build
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: conan build . --build=missing

      - name: Toolset tests (Python)
        if: matrix.cc == 'gcc-13'
        run: python -m pytest -q toolset/tests

      # GCC for the machine (toolset/gcc): the cross compiler built from its
      # sources on one Linux job - a quarter of an hour, so the installed
      # compiler is cached by the script and the patch that make it - then
      # the toolset's example programs and STARS built with it, run by the
      # ms0515-run of the build above.
      - name: Cache the pdp11 cross compiler
        if: matrix.cc == 'gcc-13'
        id: pdp11-gcc
        uses: actions/cache@v5
        with:
          path: ~/pdp11-gcc
          key: pdp11-gcc-${{ hashFiles('toolset/gcc/build-toolchain.sh', 'toolset/gcc/gcc-pdp11-cmpsi.patch') }}

      - name: Build the pdp11 cross compiler
        if: matrix.cc == 'gcc-13' && steps.pdp11-gcc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev
          toolset/gcc/build-toolchain.sh ~/pdp11-gcc

      - name: Build the GCC toolset's examples and STARS
        if: matrix.cc == 'gcc-13'
        run: |
          export MS0515_GCC=~/pdp11-gcc
          export MS0515_RUN="${{ github.workspace }}/build/Release/ms0515/tools/run/ms0515-run"
          cmake -S toolset/gcc/examples -B toolset/gcc/examples/build -G Ninja
          cmake --build toolset/gcc/examples/build
          cmake -S projects/stars -B projects/stars/build -G Ninja
          cmake --build projects/stars/build

      # UBIX with the same compiler: its diskettes, and rt11test.dsk with the
      # examples above and the collection's SABOT2 for /bin/rt11's tests.
      - name: Build UBIX
        if: matrix.cc == 'gcc-13'
        run: |
          export MS0515_GCC=~/pdp11-gcc
          cmake -S projects/unix -B projects/unix/build -G Ninja
          cmake --build projects/unix/build

      # The two SL suites boot the dec system of the collection with its
      # SL.SYS files and type at it.  The GCC toolset's examples, STARS and
      # UBIX, built above on that job alone: the folder or image named makes
      # a missing one a failure, not a skip.
      - name: Run tests
        shell: bash
        working-directory: build/Release
        run: |
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          ./projects/rt11/handlers/sl/tests/sl_tests$EXE
          ./projects/sl/tests/sltab_tests$EXE
          if [ "${{ matrix.cc }}" = "gcc-13" ]; then
            ./toolset/gcc/tests/gcc_tests --gcc-sav="${{ github.workspace }}/toolset/gcc/examples/build/sav"
            ./projects/stars/tests/stars_tests --stars-sav="${{ github.workspace }}/projects/stars/build/sav"
            ./projects/unix/tests/unix_tests --unix-dsk="${{ github.workspace }}/projects/unix/build/unix.dsk"
          fi
