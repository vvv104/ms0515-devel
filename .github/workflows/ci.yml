name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One job: the emulator is checked on every compiler and platform by its
  # own CI, and the programs here are PDP-11 binaries whatever the host.
  build:
    name: ubuntu / gcc-13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The emulator and the software collection beside this repository, at
      # the refs deps.toml names - the way a newcomer gets them.
      - name: Fetch the repositories this one stands on
        run: python tools/deps.py

      - name: Install Conan
        run: pip install "conan>=2.0" ninja pytest

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-ubuntu-gcc-13-${{ hashFiles('deps.toml', 'conanfile.py') }}
          restore-keys: |
            conan-ubuntu-gcc-13-

      - name: Install GCC 13
        run: sudo apt-get install -y gcc-13 g++-13

      - name: Configure Conan profile
        run: |
          conan profile detect --force
          PROFILE=~/.conan2/profiles/default
          sed -i -e 's/^compiler.cppstd=.*/compiler.cppstd=20/' \
                 -e 's/^compiler=.*/compiler=gcc/' \
                 -e 's/^compiler\.version=.*/compiler.version=13/' "$PROFILE"
          {
            echo ""
            echo "[conf]"
            echo "tools.system.package_manager:mode=install"
            echo "tools.system.package_manager:sudo=True"
          } >> "$PROFILE"
          echo "=== Conan profile ==="
          cat "$PROFILE"

      # The harnesses, with the emulator built inside the same build.
      - name: Build
        env:
          CC: gcc-13
          CXX: g++-13
        run: conan build . --build=missing

      - name: Toolset tests (Python)
        run: python -m pytest -q toolset/tests

      # Minesweeper, built from its Pascal sources by the machine's PAS1,
      # MACRO and LINK run with the ms0515-run of the build above.  (FIST
      # and Manic Miner need the original games, which are never here.)
      - name: Build Minesweeper
        run: |
          export MS0515_RUN="${{ github.workspace }}/build/Release/ms0515/tools/run/ms0515-run"
          cmake -S projects/minesweeper -B projects/minesweeper/build -G Ninja
          cmake --build projects/minesweeper/build

      # GCC for the machine (toolset/gcc): the cross compiler built from its
      # sources - a quarter of an hour, so the installed compiler is cached
      # by the script and the patch that make it - then the toolset's example
      # programs and STARS built with it, run by the ms0515-run above.
      - name: Cache the pdp11 cross compiler
        id: pdp11-gcc
        uses: actions/cache@v5
        with:
          path: ~/pdp11-gcc
          key: pdp11-gcc-${{ hashFiles('toolset/gcc/build-toolchain.sh', 'toolset/gcc/gcc-pdp11-cmpsi.patch') }}

      - name: Build the pdp11 cross compiler
        if: steps.pdp11-gcc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev
          toolset/gcc/build-toolchain.sh ~/pdp11-gcc

      - name: Build the GCC toolset's examples and STARS
        run: |
          export MS0515_GCC=~/pdp11-gcc
          export MS0515_RUN="${{ github.workspace }}/build/Release/ms0515/tools/run/ms0515-run"
          cmake -S toolset/gcc/examples -B toolset/gcc/examples/build -G Ninja
          cmake --build toolset/gcc/examples/build
          cmake -S projects/stars -B projects/stars/build -G Ninja
          cmake --build projects/stars/build

      # UBIX with the same compiler: its diskettes, and rt11test.dsk with the
      # examples above and the collection's SABOT2 for /bin/rt11's tests.
      - name: Build UBIX
        run: |
          export MS0515_GCC=~/pdp11-gcc
          cmake -S projects/unix -B projects/unix/build -G Ninja
          cmake --build projects/unix/build

      # The two SL suites boot the dec system of the collection with its
      # SL.SYS files and type at it; the rest run the programs built above,
      # each named by its folder or image, so a missing one is a failure,
      # not a skip.
      - name: Run tests
        working-directory: build/Release
        run: |
          ./projects/rt11/handlers/sl/tests/sl_tests
          ./projects/sl/tests/sltab_tests
          ./projects/minesweeper/tests/mine_tests --mine-game="${{ github.workspace }}/projects/minesweeper/build/game"
          ./toolset/gcc/tests/gcc_tests --gcc-sav="${{ github.workspace }}/toolset/gcc/examples/build/sav"
          ./projects/stars/tests/stars_tests --stars-sav="${{ github.workspace }}/projects/stars/build/sav"
          ./projects/unix/tests/unix_tests --unix-dsk="${{ github.workspace }}/projects/unix/build/unix.dsk"

      # What the run built, to take and try: Minesweeper, STARS and UBIX's
      # release diskettes.
      - uses: actions/upload-artifact@v4
        with:
          name: ms0515-devel-programs
          path: |
            projects/minesweeper/build/game
            projects/stars/build/sav/STARS.SAV
            projects/unix/build/ubix.dsk
            projects/unix/build/ubix01.dsk
